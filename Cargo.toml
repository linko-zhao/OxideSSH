[workspace]
resolver = "3"
members = [
    "crates/oxide-ssh-app",
    "crates/oxide-ssh-core",
    "crates/oxide-ssh-terminal",
    "crates/oxide-ssh-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
authors = ["Linko zhao"]
repository = "https://github.com/linko-zhao/OxideSSH"

[workspace.dependencies]
async-channel = "=2.5.0"
bytes = "1.10"
directories = "6.0"
futures = "0.3"
gpui = "=0.2.2"
gpui-component = "=0.5.1"
gpui-component-assets = "=0.5.1"
keyring = { version = "=4.1.6", features = ["v1"] }
secret-service = { version = "=5.1.0", default-features = false, features = ["rt-tokio-crypto-rust"] }
security-framework = "=3.7.0"
windows-sys = { version = "=0.61.2", features = ["Win32_Security_Credentials", "Win32_Foundation"] }
oxide-ssh-app = { path = "crates/oxide-ssh-app" }
oxide-ssh-core = { path = "crates/oxide-ssh-core" }
oxide-ssh-terminal = { path = "crates/oxide-ssh-terminal" }
pageant = "=0.2.1"
parking_lot = "0.12"
portable-pty = "=0.9.0"
russh = { version = "=0.65.1", default-features = false, features = ["ring", "rsa", "flate2"] }
rand = "0.10"
rfd = "0.15"
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smallvec = "=1.15.2"
tempfile = "3.20"
sys-locale = "=0.3.2"
thiserror = "2.0"
toml_edit = { version = "0.25.13", features = ["serde"] }
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "net", "time", "sync", "io-util"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }
uuid = { version = "1.18", features = ["serde", "v4"] }
