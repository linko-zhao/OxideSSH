name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release-pr:
    name: Update release PR
    if: "!startsWith(github.event.head_commit.message, 'chore: release ')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - name: Validate pushed commits
        run: |
          commits=()
          while IFS= read -r commit; do commits+=("$commit"); done < <(git log --format=%s "${{ github.event.before }}..${{ github.event.after }}")
          for commit in "${commits[@]}"; do
            if ! [[ "$commit" =~ ^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([^()]+\))?!?:\ .+ ]]; then
              echo "Invalid Conventional Commit: $commit" >&2
              exit 1
            fi
          done
        shell: bash
      - uses: release-plz/action@038b3bb42de75ac07329d69e588c76d35563f038 # v0.5
        id: release-plz
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Sync package version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr=$(gh pr list --state open --head release-plz- --json headRefName --jq '.[0].headRefName')
          if [ -n "$pr" ]; then
            git fetch origin "$pr"
            git switch --track -C "$pr" "origin/$pr"
            pwsh packaging/sync-version.ps1
            if ! git diff --quiet; then
              git add Packager.toml
              git commit --amend --no-edit
              git push --force-with-lease
            fi
          fi
        shell: bash

  tag:
    name: Tag merged release
    if: "startsWith(github.event.head_commit.message, 'chore: release ')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - name: Verify release pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '[.[] | select(.state == "closed" and .merged_at != null and (.head.ref | startswith("release-plz-")))] | length')
          test "$pr" = 1
        shell: bash
      - name: Check package versions
        run: pwsh packaging/sync-version.ps1 -Check
        shell: pwsh
      - uses: release-plz/action@038b3bb42de75ac07329d69e588c76d35563f038 # v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
